name: Sync Railway dependency lockfile

on:
  push:
    branches:
      - starscream/railway-node-runtime-20261109
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'starscream/railway-node-runtime-20261109' || github.ref == 'refs/heads/starscream/railway-node-runtime-20261109'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: starscream/railway-node-runtime-20261109
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from the pinned Hydrogen-compatible versions
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize Railway Node lockfile"
          git push origin HEAD:starscream/railway-node-runtime-20261109