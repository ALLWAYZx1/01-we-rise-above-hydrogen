name: Hydrogen CI

on:
  pull_request:
    branches: [main, fix/codegen-unique-new-arrivals-fragment]
  push:
    branches: [main, fix/ci-build-before-lint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrogen-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Install, build, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The Node adapter bundles against the generated Hydrogen server build.
      - name: Build Hydrogen storefront
        run: npm run build

      - name: Smoke-test Railway Node server startup
        run: |
          set -eu
          log_file="$(mktemp)"
          PORT=4317 npm start >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rm -f "$log_file"' EXIT
          for attempt in $(seq 1 15); do
            if grep -q "We Rise Above listening on 0.0.0.0:4317" "$log_file"; then
              cat "$log_file"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          cat "$log_file"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
