name: Storefront 1000183364

# Production deploys are manual-only. Never publish to Oxygen on an arbitrary push.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Explicitly confirm that this run should deploy to Oxygen production"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    # Only allow a confirmed manual run from main. Selecting another branch or
    # leaving confirmation at "no" cannot publish to Oxygen.
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == 'yes'
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e89f490622c26663eb6cf354f896a7aa3d # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to Oxygen
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000183364 }}
